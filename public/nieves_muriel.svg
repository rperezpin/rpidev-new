<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo círculo ámbar oscuro -->
  <circle cx="32" cy="32" r="32" fill="#4A2C0A"/>
  <!-- Anillo dorado fino -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#C9A04A" stroke-width="1.2"/>
  <!-- Segundo anillo muy fino para elegancia -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#C9A04A" stroke-width="0.4" opacity="0.6"/>
  <!-- Iniciales en serif itálica -->
  <text
    x="32"
    y="42"
    font-family="Georgia, 'Palatino Linotype', Palatino, serif"
    font-size="23"
    font-style="italic"
    font-weight="400"
    text-anchor="middle"
    fill="#F5E8D0"
    letter-spacing="1.5">NM</text>
</svg>
